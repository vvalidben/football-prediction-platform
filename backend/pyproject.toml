[project]
name = "football-prediction-backend"
version = "0.1.0"
description = "API for the football match prediction platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx2>=2.13",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
# What the API needs to load a saved model and predict: no training, tracking or
# gradient boosting, so the serving image stays small.
serve = [
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
]
# Model training and experiment tracking (not needed by the API server).
ml = [
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "mlflow>=3.1",
    # TreeSHAP for the tree models' explanations. Not in `serve`: the serving image
    # cannot load a tree model anyway, and says so.
    "shap>=0.46",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    # Dependency vulnerability audit: `python scripts/check.py --audit`.
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "ASYNC",
]

[tool.ruff.lint.pep8-naming]
# SQLAlchemy declared_attr methods receive the class, conventionally named `cls`.
classmethod-decorators = ["sqlalchemy.orm.declared_attr", "declared_attr"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # asserts; seeded pseudo-random test data
# Generated migrations embed long SQL expressions verbatim.
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
# Celery's decorators are untyped, which would otherwise make every task untyped.
module = ["app.tasks.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party ML libraries without (complete) type information.
module = ["sklearn.*", "scipy.*", "joblib.*", "mlflow.*", "xgboost.*", "lightgbm.*", "shap.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside starlette.testclient itself; nothing to fix in this codebase.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: requires running PostgreSQL and Redis (enable with RUN_INTEGRATION_TESTS=1)",
]
