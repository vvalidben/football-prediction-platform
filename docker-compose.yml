# Local stack: PostgreSQL, Redis, FastAPI backend, React frontend (nginx).
# Values come from `.env` (copy `.env.example`). Host ports bind to 127.0.0.1 only.

name: football-prediction

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-3}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-300}
      RATE_LIMIT_PREDICT_REQUESTS: ${RATE_LIMIT_PREDICT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      STATUS_CACHE_SECONDS: ${STATUS_CACHE_SECONDS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_REQUESTS_PER_MINUTE: ${API_FOOTBALL_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      FOOTBALL_DATA_REQUESTS_PER_MINUTE: ${FOOTBALL_DATA_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_FIRST_SEASON: ${FOOTBALL_DATA_FIRST_SEASON:-2023}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Model artifacts are built outside the serving image (training needs the
      # `ml` extra). The registry records where they are, so that path has to
      # exist in here too. Read-only: serving never writes a model.
      - ./backend/models:/models:ro
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  # Background jobs: one worker runs them, beat schedules them. Both use the backend
  # image and read every schedule from the environment (see docs/scheduled-jobs.md).
  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_REQUESTS_PER_MINUTE: ${API_FOOTBALL_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      FOOTBALL_DATA_REQUESTS_PER_MINUTE: ${FOOTBALL_DATA_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_FIRST_SEASON: ${FOOTBALL_DATA_FIRST_SEASON:-2023}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-4}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_COMPETITIONS: ${JOB_COMPETITIONS:-}
      JOB_PROVIDER: ${JOB_PROVIDER:-api_football}
      SCHEDULE_FIXTURES_MINUTES: ${SCHEDULE_FIXTURES_MINUTES:-360}
      SCHEDULE_RESULTS_MINUTES: ${SCHEDULE_RESULTS_MINUTES:-60}
      SCHEDULE_STATISTICS_MINUTES: ${SCHEDULE_STATISTICS_MINUTES:-180}
      SCHEDULE_FEATURES_MINUTES: ${SCHEDULE_FEATURES_MINUTES:-120}
      SCHEDULE_PREDICTIONS_MINUTES: ${SCHEDULE_PREDICTIONS_MINUTES:-180}
      SCHEDULE_EVALUATION_MINUTES: ${SCHEDULE_EVALUATION_MINUTES:-120}
      SCHEDULE_RETRAIN_MINUTES: ${SCHEDULE_RETRAIN_MINUTES:-1440}
      SCHEDULE_FAILURE_REPORT_MINUTES: ${SCHEDULE_FAILURE_REPORT_MINUTES:-1440}
      PREDICTION_HORIZON_DAYS: ${PREDICTION_HORIZON_DAYS:-7}
      RETRAIN_ENABLED: ${RETRAIN_ENABLED:-true}
      RETRAIN_EVERY_DAYS: ${RETRAIN_EVERY_DAYS:-30}
      RETRAIN_MIN_NEW_MATCHES: ${RETRAIN_MIN_NEW_MATCHES:-100}
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-5}
      TASK_RETRY_BACKOFF_SECONDS: ${TASK_RETRY_BACKOFF_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: []
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=${WORKER_CONCURRENCY:-2}
    healthcheck:
      # Replaces the image's API healthcheck: this container runs a worker, not the API.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    volumes:
      # The prediction job loads the active model, from the same path as the API.
      - ./backend/models:/models:ro

  beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY:-}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      API_FOOTBALL_REQUESTS_PER_MINUTE: ${API_FOOTBALL_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_BASE_URL: ${FOOTBALL_DATA_BASE_URL:-https://api.football-data.org/v4}
      FOOTBALL_DATA_REQUESTS_PER_MINUTE: ${FOOTBALL_DATA_REQUESTS_PER_MINUTE:-10}
      FOOTBALL_DATA_FIRST_SEASON: ${FOOTBALL_DATA_FIRST_SEASON:-2023}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-4}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_COMPETITIONS: ${JOB_COMPETITIONS:-}
      JOB_PROVIDER: ${JOB_PROVIDER:-api_football}
      SCHEDULE_FIXTURES_MINUTES: ${SCHEDULE_FIXTURES_MINUTES:-360}
      SCHEDULE_RESULTS_MINUTES: ${SCHEDULE_RESULTS_MINUTES:-60}
      SCHEDULE_STATISTICS_MINUTES: ${SCHEDULE_STATISTICS_MINUTES:-180}
      SCHEDULE_FEATURES_MINUTES: ${SCHEDULE_FEATURES_MINUTES:-120}
      SCHEDULE_PREDICTIONS_MINUTES: ${SCHEDULE_PREDICTIONS_MINUTES:-180}
      SCHEDULE_EVALUATION_MINUTES: ${SCHEDULE_EVALUATION_MINUTES:-120}
      SCHEDULE_RETRAIN_MINUTES: ${SCHEDULE_RETRAIN_MINUTES:-1440}
      SCHEDULE_FAILURE_REPORT_MINUTES: ${SCHEDULE_FAILURE_REPORT_MINUTES:-1440}
      PREDICTION_HORIZON_DAYS: ${PREDICTION_HORIZON_DAYS:-7}
      RETRAIN_ENABLED: ${RETRAIN_ENABLED:-true}
      RETRAIN_EVERY_DAYS: ${RETRAIN_EVERY_DAYS:-30}
      RETRAIN_MIN_NEW_MATCHES: ${RETRAIN_MIN_NEW_MATCHES:-100}
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-5}
      TASK_RETRY_BACKOFF_SECONDS: ${TASK_RETRY_BACKOFF_SECONDS:-10}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    entrypoint: []
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - beat
      - --loglevel=info
      # The image runs as a non-root user: keep beat's schedule file somewhere writable.
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      # The scheduler has nothing to serve; the image's API healthcheck does not apply.
      disable: true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The image starts as root to bind :80 and hand the workers to the nginx user.
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The image renders nginx.conf.template into conf.d at startup, so that
      # directory has to be writable even though the root filesystem is not.
      - /etc/nginx/conf.d
    # Container logs are capped, so a chatty failure cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  postgres-data:
  redis-data:
